name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest tests -q

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --target backend -t harbin-platform-api:ci -f docker/Dockerfile .

      - name: Smoke test backend image imports
        run: docker run --rm --entrypoint python harbin-platform-api:ci -c "from src.api.main import app; print(app.title)"

      - name: Build frontend image
        run: docker build --target frontend -t harbin-platform-ui:ci -f docker/Dockerfile .
