# Streamlit 原生主题（官方推荐做法：主题走 config.toml，不用 CSS 覆盖）
# 深/浅双模式：右上角 ⚙ 设置 → Theme 可切换；st.context.theme.type 可读当前模式
# 深色：冰雪大屏风（参考官方 Nord 模板，主色改冰蓝）
# 浅色：清爽冰雪风

[theme]
base = "dark"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
baseFontWeight = 400
linkUnderline = false
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "12px"
buttonRadius = "10px"
# 诊断类型语义色（红=设施不足/橙=高峰承载/紫=局部风险/绿=分流承接/蓝=均衡/灰=监测）
chartCategoricalColors = ["#F87171", "#FB923C", "#C084FC", "#4ADE80", "#38BDF8", "#94A3B8"]

[theme.light]
primaryColor = "#0284C7"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#F1F5F9"
codeBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
linkColor = "#0284C7"
borderColor = "#E2E8F0"
codeTextColor = "#0F172A"
headingFontSizes = ["32px", "24px", "20px", "16px", "14px", "12px"]
headingFontWeights = [700, 700, 600, 600, 500, 500]

[theme.light.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F9"
borderColor = "#E2E8F0"

[theme.dark]
primaryColor = "#38BDF8"
backgroundColor = "#090D16"
secondaryBackgroundColor = "#121722"
codeBackgroundColor = "#121722"
textColor = "#F1F5F9"
linkColor = "#38BDF8"
borderColor = "#1E293B"
codeTextColor = "#F1F5F9"
headingFontSizes = ["32px", "24px", "20px", "16px", "14px", "12px"]
headingFontWeights = [700, 700, 600, 600, 500, 500]

[theme.dark.sidebar]
backgroundColor = "#121722"
secondaryBackgroundColor = "#182030"
borderColor = "#1E293B"

