# 多源数据自动化 Pipeline 配置
# 所有相对路径均以仓库根目录为基准解析。

[io]
xhs     = "analysis/V25_Full_Mapping/xhs_to_amap_full_mapped.csv"
dp      = "analysis/V25_Full_Mapping/dianping_to_amap_full_mapped.csv"
